<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexa — AI Voice Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <div class="container">
          <div class="brand">
      <div class="logo">
        <svg width="56" height="56" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
          <circle cx="28" cy="28" r="28" fill="#223832"/>
          <rect x="16" y="24" width="4" height="8" rx="2" fill="#7fc2ff"/>
          <rect x="23" y="18" width="4" height="20" rx="2" fill="#4fe0b0"/>
          <rect x="30" y="14" width="4" height="28" rx="2" fill="#4fe0b0"/>
          <rect x="37" y="20" width="4" height="16" rx="2" fill="#7fc2ff"/>
        </svg>
      </div>
      <h1>Nexa</h1>
      <p class="subtitle">AI Voice Assistant</p>
    </div>

    <p id="status">Press the button and start speaking</p>

    <button id="micBtn">🎤 Start Recording</button>

    <div class="chat-box">
      <div class="bubble user">
        <strong>You</strong>
        <p id="userText">—</p>
      </div>
      <div class="bubble ai">
        <strong>Nexa</strong>
        <p id="aiText">—</p>
      </div>
    </div>

    <button id="resetBtn">Reset conversation</button>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
